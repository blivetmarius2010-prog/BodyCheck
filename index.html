<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BodyCheck</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:system-ui,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top, rgba(34,197,94,.2), transparent 40%),
    radial-gradient(circle at bottom, rgba(56,189,248,.2), transparent 40%),
    #020617;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:440px;
  max-height:90vh;
  overflow-y:auto;
  padding:26px;
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

h1{text-align:center}
.subtitle{text-align:center;opacity:.8;margin-bottom:18px}

section{margin-top:22px}
h2{margin-bottom:10px}
h3{margin:14px 0 8px;font-size:1em;opacity:.85}

.block{
  margin-bottom:10px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.35);
}

.block label{display:block;margin-bottom:6px}
.block input{width:100%}

.value{text-align:center;font-size:.9em;margin-top:4px}

.bar{
  width:100%;
  height:16px;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:.4s;
}

.level{text-align:center;margin-top:8px;font-weight:bold}

.message{
  margin-top:10px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.3);
}

ul{padding-left:18px;margin-top:6px}

button{
  margin-top:16px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#22c55e,#38bdf8);
  font-weight:bold;
  cursor:pointer;
}

.footer{
  margin-top:14px;
  font-size:.75em;
  opacity:.7;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">
<h1>🧠 BodyCheck</h1>
<p class="subtitle">Évalue ton état physique et mental</p>

<section>
<h2>💤 Sommeil</h2>

<div class="block">
<label>Qualité du sommeil</label>
<input type="range" min="0" max="10" value="5">
<div class="value">5 / 10</div>
</div>

<div class="block">
<label>Fatigue au réveil</label>
<input type="range" min="0" max="10" value="4">
<div class="value">4 / 10</div>
</div>
</section>

<section>
<h2>🧠 Mental</h2>

<div class="block">
<label>Stress</label>
<input type="range" min="0" max="10" value="3">
<div class="value">3 / 10</div>
</div>

<div class="block">
<label>Concentration</label>
<input type="range" min="0" max="10" value="6">
<div class="value">6 / 10</div>
</div>
</section>

<section>
<h2>💪 Physique</h2>

<div class="block">
<label>Douleurs corporelles</label>
<input type="range" min="0" max="10" value="2">
<div class="value">2 / 10</div>
</div>

<div class="block">
<label>Niveau d’énergie</label>
<input type="range" min="0" max="10" value="6">
<div class="value">6 / 10</div>
</div>
</section>

<section>
<h2>📊 État global</h2>

<div class="bar"><div class="bar-fill" id="bar"></div></div>
<div class="level" id="level">Évaluation en cours</div>

<div class="message" id="message">
Ajuste les curseurs pour voir ton état.
</div>

<ul id="advice"></ul>

<button onclick="resetAll()">Réinitialiser</button>
</section>

<div class="footer">
Outil de bien-être – ne remplace pas un avis professionnel
</div>
</div>

<script>
const inputs=document.querySelectorAll("input");
const bar=document.getElementById("bar");
const level=document.getElementById("level");
const message=document.getElementById("message");
const advice=document.getElementById("advice");

inputs.forEach(i=>{
  const v=i.nextElementSibling;
  i.oninput=()=>{
    v.textContent=i.value+" / 10";
    update();
  };
});

function update(){
  let sum=0;
  inputs.forEach(i=>sum+=Number(i.value));
  let score=Math.round((sum/(inputs.length*10))*100);

  bar.style.width=score+"%";

  advice.innerHTML="";

  if(score<35){
    bar.style.background="#22c55e";
    level.textContent="🟢 Bon équilibre";
    message.textContent="Ton état général est bon.";
    advice.innerHTML+="<li>Continue à maintenir ce rythme</li>";
  }
  else if(score<65){
    bar.style.background="#f59e0b";
    level.textContent="🟠 Équilibre fragile";
    message.textContent="Quelques ajustements sont conseillés.";
    advice.innerHTML+="<li>Améliorer le sommeil</li>";
    advice.innerHTML+="<li>Faire des pauses régulières</li>";
  }
  else{
    bar.style.background="#ef4444";
    level.textContent="🔴 Surcharge détectée";
    message.textContent="Ton corps ou ton mental montre des signes de fatigue.";
    advice.innerHTML+="<li>Repos prioritaire</li>";
    advice.innerHTML+="<li>Réduire le stress et les écrans</li>";
  }
}

function resetAll(){
  inputs.forEach(i=>{
    i.value=5;
    i.nextElementSibling.textContent="5 / 10";
  });
  bar.style.width="0%";
  level.textContent="Évaluation réinitialisée";
  message.textContent="Ajuste les curseurs.";
  advice.innerHTML="";
}
</script>

</body>
</html>
